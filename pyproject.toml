[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "70sl-scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Firebase / Google Cloud
    "firebase-admin>=6.5",
    "google-cloud-storage>=2.16",
    # api
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "slowapi>=0.1.9",
    # http + html parsing
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    # utils
    "python-dotenv>=1.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
scraper = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.5",
    "black>=24.4",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
